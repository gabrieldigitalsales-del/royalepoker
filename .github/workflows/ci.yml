name: Build Poker Royale
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: npm run test:smoke
      - run: node --test --test-concurrency=4 tests/royale-payout-shop-lock.test.mjs tests/royale-runout-integration.test.mjs tests/royale-runout-showdown-headsup.test.mjs tests/royale-seat-runout-avatar-regression.test.mjs tests/showdown-flow-unified.test.mjs tests/cash-updates.test.mjs tests/buyin-exact-amount.test.mjs tests/seat-view.test.mjs tests/table-balances.test.mjs tests/worker-stability.test.mjs tests/royale-watermelon-runout-settlement.test.mjs
