# Render Blueprint: new Web Service -> Blueprint -> connect GitHub repository.
# Test-only default: free Render services have ephemeral local SQLite.
# For persistent accounts/hands, set DATABASE_URL to managed PostgreSQL.
services:
  - type: web
    name: royalepoker
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '10000'
      - key: POKER_ENGINE_TIMEOUT_MS
        value: '90000'
